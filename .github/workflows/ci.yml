name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PipeWire and clang build screenpeek-frames, the KDE and GNOME frame helper.
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libxdo-dev pkg-config dbus libpipewire-0.3-dev clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: node tests/helpers.mjs
      - run: python3 -m doctest bench/compare_tools.py
      - run: python3 -m doctest scripts/package-manifests.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - name: ARM64 builds too
        run: cargo check --locked --target aarch64-pc-windows-msvc
      - run: cargo run --locked -- doctor
      - name: install.ps1 in PowerShell 7
        shell: pwsh
        env:
          SCREENPEEK_PREFIX: ${{ runner.temp }}\pwsh7
        run: |
          ./install.ps1
          & "$env:SCREENPEEK_PREFIX\screenpeek.exe" --version
      - name: install.ps1 in Windows PowerShell 5.1, the irm | iex way
        shell: powershell
        env:
          SCREENPEEK_PREFIX: ${{ runner.temp }}\ps51
        run: |
          $before = $ProgressPreference
          Get-Content ./install.ps1 -Raw | Invoke-Expression
          & "$env:SCREENPEEK_PREFIX\screenpeek.exe" --version
          if ($ProgressPreference -ne $before) { throw 'install.ps1 changed the caller session' }
      - name: Languages
        shell: pwsh
        run: |
          ./scripts/fetch-models.ps1 heb
          if (-not (Test-Path "$env:APPDATA\tessdata\heb.traineddata")) { throw 'heb was not fetched' }
          cargo run --locked -- doctor
      - name: Scoop installs from this repository's bucket
        shell: pwsh
        run: |
          Invoke-RestMethod https://get.scoop.sh -OutFile scoop-install.ps1
          ./scoop-install.ps1 -RunAsAdmin
          $env:Path = "$HOME\scoop\shims;$env:Path"
          scoop bucket add screenpeek https://github.com/${{ github.repository }}
          scoop install screenpeek/screenpeek
          screenpeek --version

  gnome:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: >
          sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libxdo-dev pkg-config
          dbus gnome-shell gnome-text-editor xdg-desktop-portal-gnome at-spi2-core libglib2.0-bin
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: bash scripts/gnome-ci.sh
