name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish the binaries against
        required: true

permissions:
  contents: write

jobs:
  # The frame helper needs a newer PipeWire than 22.04 has. Only it is built on 24.04;
  # the main binary stays on 22.04 to keep running on older systems.
  frames:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev clang pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p screenpeek-frames
      - uses: actions/upload-artifact@v4
        with:
          name: screenpeek-frames
          path: target/release/screenpeek-frames

  binaries:
    needs: frames
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: screenpeek-x86_64-linux.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: screenpeek-x86_64-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libxdo-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Add the frame helper (Linux)
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: screenpeek-frames
          path: target/${{ matrix.target }}/release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x target/${{ matrix.target }}/release/screenpeek-frames
          tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release screenpeek screenpeek-frames

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/screenpeek.exe -DestinationPath ${{ matrix.archive }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          files: ${{ matrix.archive }}
