[package]
name = "screenpeek"
version = "0.0.1-alpha"
edition = "2021"
rust-version = "1.94"
description = "Read the screen as a numbered list of text elements, then click them by name"
repository = "https://github.com/I-No-oNe/screenpeek"
license = "MIT"
keywords = ["ocr", "automation", "screen", "accessibility", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
enigo = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
ocrs = "0.13"
rayon = "1"
rten = { version = "0.26", features = ["mmap"] }
rten-imageproc = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1.25"
ureq = "3"

[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = { version = "0.9", features = ["image"] }

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6", features = ["wayland"] }
memmap2 = "0.9"
tempfile = "3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.13", features = ["randr"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25"

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5", default-features = false, features = ["p2p"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
